<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mf-title mf-desc">
  <title id="mf-title">MarkFolio</title>
  <desc id="mf-desc">Warm yellow rounded icon with layered cream folio pages, a folded corner and a dark amber Markdown M badge.</desc>
  <!--
    图标定位：Markdown 文档 + Folio 纸张叠层。
    - 暖黄圆角底表示 Markdown 的黄色品牌基调；
    - 奶油色叠层纸张与右上折角表示 folio（一叠纸页）；
    - 深琥珀 M↓ 方块点明 Markdown，放在左下角形成主视觉。
    构图沿用 docs/icons 规范：512 viewBox，图形贴边，圆角外透明。
  -->
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.55" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#ffd05a"/>
    </linearGradient>
    <linearGradient id="mf-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1bd"/>
      <stop offset="1" stop-color="#ffd76d"/>
    </linearGradient>
    <linearGradient id="mf-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <linearGradient id="mf-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd65c"/>
      <stop offset="1" stop-color="#eda500"/>
    </linearGradient>
  </defs>

  <!-- 暖黄圆角底 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#mf-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#e8ad20" stroke-width="8"/>
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="#fffdf7" stroke-width="5" opacity="0.68"/>

  <!-- 叠层纸张：最远一层 -->
  <g transform="rotate(5 286 268)">
    <rect x="180" y="86" width="204" height="314" rx="24" fill="#ffdf84" stroke="#dda41c" stroke-width="6"/>
  </g>
  <!-- 叠层纸张：中间一层 -->
  <g transform="rotate(-2.5 268 266)">
    <rect x="158" y="98" width="216" height="326" rx="26" fill="url(#mf-sheet)" stroke="#d9a01a" stroke-width="6"/>
  </g>

  <!-- 最上层 folio 页面：右上折角 -->
  <g transform="rotate(-6.5 254 272)">
    <path d="M150 104 H310 L380 174 V414 Q380 440 354 440 H150 Q124 440 124 414 V130 Q124 104 150 104 Z" fill="url(#mf-page)" stroke="#d3a33a" stroke-width="7"/>
    <path d="M310 104 L380 174 H310 Z" fill="url(#mf-fold)" stroke="#cf9410" stroke-width="5" stroke-linejoin="round"/>
    <path d="M318 118 V166 H366" fill="none" stroke="#fff0b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

    <!-- 文档标题与正文占位线 -->
    <rect x="160" y="198" width="176" height="24" rx="12" fill="#edc464"/>
    <rect x="160" y="240" width="148" height="18" rx="9" fill="#f4d98f"/>
    <rect x="160" y="272" width="166" height="18" rx="9" fill="#f7e3ae"/>

    <!-- Markdown M↓ 方块 -->
    <rect x="144" y="306" width="118" height="118" rx="28" fill="#744405" stroke="#5a3302" stroke-width="5"/>
    <path d="M166 386 V330 L192 356 L218 330 V386" fill="none" stroke="#fff8e6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M238 332 V378 M228 368 L238 380 L248 368" fill="none" stroke="#fff8e6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 方块右侧的短正文线 -->
    <rect x="278" y="330" width="84" height="16" rx="8" fill="#f5dc9c"/>
    <rect x="278" y="360" width="64" height="16" rx="8" fill="#f8e7bb"/>
  </g>
</svg>
