[package]
name = "markfolio"
version = "0.4.0"  # 版本号唯一出处；tauri.conf.json 省略 version 会回退到这里
description = "MarkFolio local Markdown workspace manager"
edition = "2021"
publish = false

[lib]
name = "markfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false
doctest = false

[[bin]]
name = "MarkFolio"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
trash = "5"
base64 = "0.22"
serde_yaml = "0.9"
regex = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
htmd = "0.6"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
onenote_parser = "2.1"
one2html = { version = "2.0", default-features = false, features = ["native-fs", "onepkg", "bin"] }
typed-path = "0.12"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
rand = "0.8"
md5 = "0.8"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
